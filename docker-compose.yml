services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: customer-churn-api
    ports:
      - "8000:8000"
    environment:
      MONITORING_DB_PATH: /app/monitoring-data/monitoring.db
      DRIFT_BASELINE_PATH: /app/reports/drift_baseline.json
    volumes:
      - ./monitoring-data:/app/monitoring-data
      - ./reports:/app/reports:ro
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: customer-churn-dashboard
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped